
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mundo dos Games</title>

    <style>
        body {
            background-color: #171717;
            color: white;
            font-family: Arial;
            margin: 0;
        }

        /* FIXED */
        .menu {
            position: fixed;
            top: 0;
            background: #292929;
            width: 100%;
            padding: 15px;
            text-align: center;
        }

        /* RELATIVE */
        .titulo {
            position: relative;
            top: 60px;
            text-align: center;
            color: #00ff99;
            padding: 20px;
        }

        /* STATIC */
        .caixa1 {
            position: static;
            background: #333;
            padding: 20px;
            margin: 20px;
        }

        /* ABSOLUTE */
        .container {
            position: relative;
            background: #333;
            height: 120px;
            margin: 20px;
        }

        .caixa2 {
            position: absolute;
            right: 10px;
            bottom: 10px;
            background: #00aa66;
            padding: 15px;
        }

        /* FLEX */
        .jogos {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px;
        }

        .jogo {
            background: #333;
            padding: 25px;
            border-radius: 10px;
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px;
        }

        .item {
            background: #444;
            padding: 20px;
            text-align: center;
        }

        /* STICKY */
        .rodape {
            position: sticky;
            bottom: 0;
            background: #00aa66;
            padding: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="menu">
        MUNDO DOS GAMES
    </div>

    <div class="titulo">
        <h1>Bem-vindo ao Mundo dos Games!</h1>
        <p>Conheça nosso universo gamer.</p>
    </div>

    <h2 style="margin: 40px 20px 10px;">
        Position Static
    </h2>

    <div class="caixa1">
        Esta é uma div com posicionamento padrão.
    </div>

    <h2 style="margin: 20px;">
        Position Absolute
    </h2>

    <div class="container">
        <div class="caixa2">
            Caixa absoluta
        </div>
    </div>

    <h2 style="margin: 20px;">
        Display Flex
    </h2>

    <div class="jogos">
        <div class="jogo">Minecraft</div>
        <div class="jogo">GTA</div>
        <div class="jogo">FIFA</div>
    </div>

    <h2 style="margin: 20px;">
        Display Grid
    </h2>

    <div class="grid">
        <div class="item">Ação</div>
        <div class="item">Aventura</div>
        <div class="item">Corrida</div>
        <div class="item">Esporte</div>
    </div>

    <div class="rodape">
        Projeto HTML e CSS - 2026
    </div>

</body>
</html>
